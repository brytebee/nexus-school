name: Build & Publish Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # triggers on v1.0.3, v1.0.4-beta.1, etc.

jobs:
  build-win:
    name: Build NSIS Installer & Publish to GitHub Releases
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public_shell/electron/package-lock.json

      - name: Install npm dependencies
        run: npm install
        working-directory: public_shell/electron

      - name: Run test suite
        run: npm test
        working-directory: public_shell/electron

      - name: Inject production environment keys
        shell: bash
        run: |
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}"   >> .env
          echo "PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}"   >> .env
          echo "NEXUS_API_SECRET=${{ secrets.NEXUS_API_SECRET }}"         >> .env
          echo "NEXUS_API_URL=${{ secrets.NEXUS_API_URL }}"               >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"     >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          # Allow .env to be included in the asar bundle
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.build.files = pkg.build.files.filter(f => f !== '!.env');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        working-directory: public_shell/electron

      - name: Sync package.json version from git tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json'));
              pkg.version = '${VERSION}';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "package.json version set to ${VERSION}"
          else
            echo "Not a v* tag — keeping package.json version unchanged"
          fi
        working-directory: public_shell/electron

      - name: Build Windows NSIS installer
        run: npm run dist:win -- --publish never
        working-directory: public_shell/electron

      - name: Force overwrite release assets on nexus-school-releases
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v${VERSION}"
          fi
          echo "Targeting release tag: $TAG_NAME"
          gh release create "$TAG_NAME" --repo brytebee/nexus-school-releases --title "$TAG_NAME" --notes-file "../../RELEASE_NOTES.md" || true
          gh release upload "$TAG_NAME" release/*.exe --repo brytebee/nexus-school-releases --clobber
        working-directory: public_shell/electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Register release on nexus-api
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE_URL="https://github.com/brytebee/nexus-school-releases/releases/download/v${VERSION}"
          if [ -n "${{ secrets.NEXUS_SOVEREIGN_SECRET }}" ] && [ -n "${{ secrets.NEXUS_API_URL }}" ]; then
            echo "Registering Windows release for v${VERSION} on nexus-api..."
            WIN_EXE=$(ls release/*.exe 2>/dev/null | head -n1 || echo "")
            WIN_MB=$([ -n "$WIN_EXE" ] && du -m "$WIN_EXE" | awk '{print $1}' || echo 0)
            WIN_HASH=$([ -n "$WIN_EXE" ] && sha256sum "$WIN_EXE" 2>/dev/null | awk '{print $1}' || echo "pending")
            WIN_FNAME=$(basename "$WIN_EXE")
            curl -s -X POST "${{ secrets.NEXUS_API_URL }}/api/sovereign/releases" \
              -H "Content-Type: application/json" \
              -H "x-sovereign-secret: ${{ secrets.NEXUS_SOVEREIGN_SECRET }}" \
              -d "{
                \"version\": \"${VERSION}\",
                \"product\": \"sch\",
                \"changelog\": \"Release v${VERSION} — real-time activation awareness, license file import relaunch, and financial bug fixes\",
                \"platforms\": [
                  {
                    \"platform\": \"win\",
                    \"download_url\": \"${BASE_URL}/${WIN_FNAME// /%20}\",
                    \"checksum\": \"${WIN_HASH}\",
                    \"size_mb\": ${WIN_MB}
                  }
                ]
              }" || true
          fi
        working-directory: public_shell/electron

      - name: Upload Windows artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nexusschoolos-win-nsis
          path: public_shell/electron/release/*.exe
          retention-days: 30
