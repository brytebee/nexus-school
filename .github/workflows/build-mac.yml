name: Build macOS DMG (Unsigned — Dev / Pre-cert)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS DMG & Publish to GitHub Releases
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public_shell/electron/package-lock.json

      - name: Install npm dependencies
        run: npm install
        working-directory: public_shell/electron

      - name: Run test suite
        run: npm test
        working-directory: public_shell/electron

      - name: Inject production environment keys
        run: |
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}"   >> .env
          echo "PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}"   >> .env
          echo "NEXUS_API_SECRET=${{ secrets.NEXUS_API_SECRET }}"         >> .env
          echo "NEXUS_API_URL=${{ secrets.NEXUS_API_URL }}"               >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"     >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.build.files = pkg.build.files.filter(f => f !== '!.env');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        working-directory: public_shell/electron

      - name: Sync package.json version from git tag
        # electron-builder names artifacts from package.json "version".
        # The committed value may be stale — overwrite it with the pushed tag
        # so built files are always named Nexus-School-OS-<tag-version>.dmg.
        # No-op when triggered from workflow_dispatch on a branch (not a v* tag).
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json'));
              pkg.version = '${VERSION}';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "package.json version set to ${VERSION}"
          else
            echo "Not a v* tag — keeping package.json version unchanged"
          fi
        working-directory: public_shell/electron

      - name: Build macOS DMG
        run: npm run dist:mac -- --publish never
        working-directory: public_shell/electron

      - name: Force overwrite release assets on nexus-school-releases
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v${VERSION}"
          fi
          echo "Targeting release tag: $TAG_NAME"
          gh release create "$TAG_NAME" --repo brytebee/nexus-school-releases --title "$TAG_NAME" --notes-file "../../RELEASE_NOTES.md" || true
          gh release upload "$TAG_NAME" release/*.dmg --repo brytebee/nexus-school-releases --clobber
        working-directory: public_shell/electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Register release on nexus-api
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE_URL="https://github.com/brytebee/nexus-school-releases/releases/download/v${VERSION}"
          if [ -n "${{ secrets.NEXUS_SOVEREIGN_SECRET }}" ] && [ -n "${{ secrets.NEXUS_API_URL }}" ]; then
            echo "Registering macOS releases for v${VERSION} on nexus-api..."
            # Compute file sizes from built artifacts (fall back to 0 if missing)
            ARM64_MB=$(du -m release/Nexus\ School\ OS-${VERSION}-arm64.dmg 2>/dev/null | awk '{print $1}' || echo 0)
            X64_MB=$(du -m release/Nexus\ School\ OS-${VERSION}.dmg 2>/dev/null | awk '{print $1}' || echo 0)
            ARM64_HASH=$(shasum -a 256 release/Nexus\ School\ OS-${VERSION}-arm64.dmg 2>/dev/null | awk '{print $1}' || echo "pending")
            X64_HASH=$(shasum -a 256 release/Nexus\ School\ OS-${VERSION}.dmg 2>/dev/null | awk '{print $1}' || echo "pending")
            curl -s -X POST "${{ secrets.NEXUS_API_URL }}/api/sovereign/releases" \
              -H "Content-Type: application/json" \
              -H "x-sovereign-secret: ${{ secrets.NEXUS_SOVEREIGN_SECRET }}" \
              -d "{
                \"version\": \"${VERSION}\",
                \"product\": \"sch\",
                \"changelog\": \"Release v${VERSION} — real-time activation awareness, license file import relaunch, and financial bug fixes\",
                \"platforms\": [
                  {
                    \"platform\": \"mac_arm64\",
                    \"download_url\": \"${BASE_URL}/Nexus%20School%20OS-${VERSION}-arm64.dmg\",
                    \"checksum\": \"${ARM64_HASH}\",
                    \"size_mb\": ${ARM64_MB}
                  },
                  {
                    \"platform\": \"mac_x64\",
                    \"download_url\": \"${BASE_URL}/Nexus%20School%20OS-${VERSION}.dmg\",
                    \"checksum\": \"${X64_HASH}\",
                    \"size_mb\": ${X64_MB}
                  }
                ]
              }" || true
          fi
        working-directory: public_shell/electron

      - name: Upload macOS DMG artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nexusschoolos-mac-dmg
          path: public_shell/electron/release/*.dmg
          retention-days: 30
