name: Build & Publish Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Signed Android APK & Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: public_shell/android

      - name: Decode & restore keystore
        run: |
          node -e "
            const fs = require('fs');
            const b64 = (process.env.KEYSTORE_B64 || '').replace(/\s+/g, '');
            const buf = Buffer.from(b64, 'base64');
            fs.writeFileSync('nexus-release.jks', buf);
          "
        working-directory: public_shell/android
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}

      - name: Inject signing credentials into gradle.properties
        run: |
          echo "android.useAndroidX=true"                                  >> gradle.properties
          echo "android.enableJetifier=true"                               >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"       >> gradle.properties
          echo "NEXUS_STORE_FILE=nexus-release.jks"                        >> gradle.properties
          echo "NEXUS_STORE_PASSWORD=${{ secrets.NEXUS_STORE_PASSWORD }}"  >> gradle.properties
          echo "NEXUS_KEY_ALIAS=${{ secrets.NEXUS_KEY_ALIAS }}"            >> gradle.properties
          echo "NEXUS_KEY_PASSWORD=${{ secrets.NEXUS_KEY_PASSWORD }}"      >> gradle.properties
        working-directory: public_shell/android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: public_shell/android

      - name: Rename APK with version tag
        run: |
          VERSION="${{ github.ref_name }}"
          cp public_shell/android/build/outputs/apk/release/Nexus-release.apk \
             ./Nexus-release-${VERSION}.apk

      - name: Set Release Notes body
        id: release_notes
        run: echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT && cat RELEASE_NOTES.md >> $GITHUB_OUTPUT && echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases with notes
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: brytebee/nexus-school-releases
          tag_name: ${{ github.ref_name }}
          name: Nexus School OS ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.RELEASE_BODY }}
          files: Nexus-release-${{ github.ref_name }}.apk

      - name: Upload APK Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: nexusschool-android-apk
          path: Nexus-release-${{ github.ref_name }}.apk
          retention-days: 30
