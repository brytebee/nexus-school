name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # triggers on v1.0.4, v1.0.5-beta.1, etc.

jobs:
  build-android:
    name: Build Release APK & Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > public_shell/android/nexus-release.jks

      - name: Write gradle.properties
        # gradle.properties was removed from git tracking during a security scrub
        # (it previously contained plaintext signing credentials). CI runners start
        # without it, so we recreate the non-secret properties here. Signing
        # credentials are injected separately via -P flags on the gradlew command.
        run: |
          cat > public_shell/android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Make gradlew executable
        run: chmod +x public_shell/android/gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PNEXUS_STORE_FILE=nexus-release.jks \
            -PNEXUS_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }} \
            -PNEXUS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PNEXUS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: public_shell/android

      - name: Extract version and rename APK
        shell: bash
        run: |
          VERSION=$(grep 'versionName' public_shell/android/build.gradle.kts \
            | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          APK_SRC=$(find public_shell/android/build/outputs/apk/release -name "*.apk" | head -1)
          APK_DEST="public_shell/android/build/outputs/apk/release/Nexus-School-OS-${VERSION}.apk"
          mv "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=${APK_DEST}" >> $GITHUB_ENV

      - name: Compute APK size and checksum
        shell: bash
        run: |
          APK_MB=$(du -m "${{ env.APK_PATH }}" | awk '{print $1}')
          APK_HASH=$(sha256sum "${{ env.APK_PATH }}" | awk '{print $1}')
          echo "APK_MB=${APK_MB}"     >> $GITHUB_ENV
          echo "APK_HASH=${APK_HASH}" >> $GITHUB_ENV

      - name: Force overwrite release assets on nexus-school-releases
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v${{ env.VERSION }}"
          fi
          echo "Targeting release tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --repo brytebee/nexus-school-releases \
            --title "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md || true
          gh release upload "$TAG_NAME" \
            "${{ env.APK_PATH }}" \
            --repo brytebee/nexus-school-releases \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Register release on nexus-api
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          BASE_URL="https://github.com/brytebee/nexus-school-releases/releases/download/v${VERSION}"
          if [ -n "${{ secrets.NEXUS_SOVEREIGN_SECRET }}" ] && [ -n "${{ secrets.NEXUS_API_URL }}" ]; then
            echo "Registering Android release for v${VERSION} on nexus-api..."
            APK_FNAME="Nexus-School-OS-${VERSION}.apk"
            curl -s -X POST "${{ secrets.NEXUS_API_URL }}/api/sovereign/releases" \
              -H "Content-Type: application/json" \
              -H "x-sovereign-secret: ${{ secrets.NEXUS_SOVEREIGN_SECRET }}" \
              -d "{
                \"version\": \"${VERSION}\",
                \"product\": \"sch\",
                \"changelog\": \"Release v${VERSION}\",
                \"platforms\": [
                  {
                    \"platform\": \"android\",
                    \"download_url\": \"${BASE_URL}/${APK_FNAME}\",
                    \"checksum\": \"${{ env.APK_HASH }}\",
                    \"size_mb\": ${{ env.APK_MB }}
                  }
                ]
              }" || true
          fi

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nexusschoolos-android-apk
          path: public_shell/android/build/outputs/apk/release/*.apk
          retention-days: 30
