name: Build Linux Installers

on:
  workflow_dispatch:          # run manually from GitHub Actions tab
  push:
    tags:
      - 'v*'                  # auto-trigger on version tags like v1.0.2

jobs:
  build-linux:
    name: Build .deb + AppImage (native Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public_shell/electron/package-lock.json

      - name: Install system dependencies (canvas / puppeteer)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Install npm dependencies
        run: npm install
        working-directory: public_shell/electron

      - name: Run tests
        run: npm test
        working-directory: public_shell/electron

      - name: Inject Production environment keys and enable .env packaging
        run: |
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}"   >> .env
          echo "PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}"   >> .env
          echo "NEXUS_API_SECRET=${{ secrets.NEXUS_API_SECRET }}"         >> .env
          echo "NEXUS_API_URL=${{ secrets.NEXUS_API_URL }}"               >> .env
          echo "NEXUS_LICENSE_PUBLIC_KEY=${{ secrets.NEXUS_LICENSE_PUBLIC_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"     >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.build.files = pkg.build.files.filter(f => f !== '!.env');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        working-directory: public_shell/electron

      - name: Set Release Notes body
        id: release_notes
        run: echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT && cat RELEASE_NOTES.md >> $GITHUB_OUTPUT && echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Linux packages (.deb + AppImage)
        run: npm run dist:linux:native -- --publish never
        working-directory: public_shell/electron

      - name: Publish to GitHub Releases with notes
        uses: softprops/action-gh-release@v2
        with:
          repository: brytebee/nexus-school-releases
          tag_name: ${{ github.ref_name }}
          name: Nexus School OS ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.RELEASE_BODY }}
          files: |
            public_shell/electron/release/*.deb
            public_shell/electron/release/*.AppImage
            public_shell/electron/release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusschoolos-deb
          path: public_shell/electron/release/*.deb
          retention-days: 30

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusschoolos-appimage
          path: public_shell/electron/release/*.AppImage
          retention-days: 30
